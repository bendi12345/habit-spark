<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <title>Kapcsolat nélkül – Szokásváltó</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #151515; color: #f5f5f5; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 26rem; text-align: center; }
      h1 { color: #f5c451; }
      p { line-height: 1.6; color: #d4d4d4; }
      button { margin-top: 1rem; border: 0; border-radius: .75rem; padding: .8rem 1.2rem; background: #f5c451; color: #151515; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Most nincs kapcsolat</h1>
      <p>A személyes útvonalad biztonsága érdekében az oldalakat nem mentjük offline megtekintésre. Kapcsolódj újra, majd próbáld meg ismét.</p>
      <button type="button" onclick="location.reload()">Újrapróbálás</button>
    </main>
  </body>
</html>
